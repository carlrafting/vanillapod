name: Publish
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dom, state]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      # 0.0.0 marks a package as unreleased, and JSR versions are immutable.
      # Runs in the package folder so only that package is published, not every
      # workspace member.
      - name: Publish @vanillapod/${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: |
          if [ "$(jq -r .version deno.json)" = "0.0.0" ]; then
            echo "Skipping publish: ${{ matrix.package }}/deno.json is still at version 0.0.0."
            exit 0
          fi
          deno publish
