name: Publish
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      # 0.0.0 marks the package as unreleased, and JSR versions are immutable.
      - name: Publish package
        run: |
          if [ "$(jq -r .version dom/deno.json)" = "0.0.0" ]; then
            echo "Skipping publish: dom/deno.json is still at version 0.0.0."
            exit 0
          fi
          deno publish
