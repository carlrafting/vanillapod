name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The library has no runtime or dev dependencies, so no install step is needed.
      - name: Run tests
        run: npm test

  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check src test vanillapod.js mod.ts

      # TODO: drop --no-check and --allow-slow-types once mod.ts type-checks cleanly.
      - name: Verify JSR package
        run: deno publish --dry-run --no-check --allow-slow-types
