name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The library has no runtime or dev dependencies, so no install step is needed.
      - name: Run tests
        run: npm test

  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Check formatting
        run: deno fmt --check src test scripts vanillapod.js mod.ts

      - name: Lint
        run: deno lint src test scripts vanillapod.js mod.ts

      # Type-checks the JS sources (JSDoc, checkJs) and regenerates the .d.ts
      # files; fails if the committed declarations are out of date.
      - name: Check type declarations are up to date
        run: |
          npm run types
          if [ -n "$(git status --porcelain -- vanillapod.d.ts src)" ]; then
            git status --short -- vanillapod.d.ts src
            git diff -- vanillapod.d.ts src
            echo "::error::Generated .d.ts files are out of date. Run 'npm run types' and commit the result."
            exit 1
          fi

      - name: Verify JSR package
        run: deno publish --dry-run
