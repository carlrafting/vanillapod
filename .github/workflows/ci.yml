name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check dom state

      # Tests live in each package's test/ folder, which has its own config with
      # the Deno namespace.
      - name: Run dom unit tests
        working-directory: dom
        run: deno test -A

      - name: Run state unit tests
        working-directory: state
        run: deno test -A

      # Type-checks the packages (checkJs). The JS entrypoint warning is non-blocking.
      - name: Verify JSR package
        run: deno publish --dry-run

  browser:
    name: Browser tests and site build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Caches DENO_DIR so Lume's modules (pinned by URL in deno.json) are
      # fetched from cdn.jsdelivr.net only when the imports change.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'tests/browser/deno.json') }}

      - name: Install Chromium
        working-directory: tests/browser
        run: deno run -A npm:playwright@^1.65.0 install --with-deps chromium

      # The tests build the site and serve it themselves (see
      # tests/browser/helpers.ts), so a broken build fails this step.
      - name: Run browser tests
        working-directory: tests/browser
        run: deno task test
